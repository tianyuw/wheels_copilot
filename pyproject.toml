[project]
name = "wheels-copilot"
version = "0.1.0"
description = "Markus-style weekly wheel strategy research and paper-trading system"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "pyyaml>=6.0",
    "yfinance>=0.2.0",
]

[project.scripts]
wheel-dry-run = "wheels_copilot.cli:main"
wheel-scan-watchlist = "wheels_copilot.scan_cli:main"
wheel-execute-validated = "wheels_copilot.execute_cli:main"
wheel-reconcile-orders = "wheels_copilot.reconcile_cli:main"
wheel-plan-covered-calls = "wheels_copilot.covered_call_cli:main"
wheel-autonomous-daily = "wheels_copilot.daily_runner_cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
