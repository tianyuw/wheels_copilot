mode: paper
broker: alpaca

execution:
  max_orders_per_run: 3
  max_validated_order_age_seconds: 120
  no_open_minutes_before_close: 30

oms:
  enabled: true
  db_path: workspace/oms/wheels_oms.sqlite

account:
  broker: alpaca
  account_type: paper
  starting_equity: 500000
  currency: USD
  live_trading_enabled: false

backtest:
  cc_risk_profile: warn_unknown_dates
  post_earnings_cooldown_days: 0

backtest_execution:
  model: day_agg_synthetic_spread
  scan_timing: previous_close_signal_next_open_fill
  fill_policy: mid
  reference_price_source: option_day_agg_open
  calibration_status: v0_uncalibrated
  fill_price_penalty_dollars: 0.00
  fill_price_penalty_pct_of_mid: 0.00
  synthetic_spread:
    min_spread_pct_of_mid: 0.08
    min_spread_dollars: 0.00
    max_spread_pct_of_mid: 0.40
    low_premium_threshold: 0.50
    low_premium_extra_pct: 0.05
    low_volume_threshold: 50
    low_volume_extra_pct: 0.05
    wide_otm_pct_threshold: 0.15
    wide_otm_extra_pct: 0.03

alpaca:
  paper_base_url: https://paper-api.alpaca.markets
  data_base_url: https://data.alpaca.markets
  stock_feed: sip
  option_feed: opra
  api_key_env: ALPACA_API_KEY
  secret_key_env: ALPACA_SECRET_KEY
  expected_account_id_env: ALPACA_EXPECTED_ACCOUNT_ID
  expected_account_number_env: ALPACA_EXPECTED_ACCOUNT_NUMBER
  request_timeout_seconds: 20

market_data:
  max_option_quote_age_seconds: 30

watchlist:
  tickers:
    - BBY
    - TSCO
    - IWM
    - MRK
    - XLE
    - UPS
    - HAL
    - ABNB
    - EOG
    - GDXJ

fundamental_filters:
  market_cap_min_hard: 2000000000
  market_cap_preferred: 5000000000
  pe_max: 50
  min_positive_quarters_out_of_5: 4
  min_positive_years_out_of_5: 4
  allow_2020_pandemic_exception: true
  prefer_dividend: true
  reject_biotech: true
  reject_chinese_adr: true
  reject_leveraged_etf: true
  reject_recent_100pct_movers: true

portfolio:
  max_active_tickers: 5
  max_correlation: 0.65
  max_same_sector_tickers: 2

trend_filter:
  require_price_above_sma200: true
  sma200_slope_lookback_days: 20
  require_sma200_slope_non_negative: true
  pause_if_price_breaks_sma200: true

market_regime:
  enabled: false
  market_symbol: SPY
  require_market_price_above_sma200: false
  require_market_sma200_slope_non_negative: false
  market_sma200_slope_lookback_days: 20
  reject_unknown_market_trend: true
  vix_enabled: false
  vix_symbol: I:VIX
  min_vix: 0.0
  max_vix: 999.0
  reject_unknown_vix: false
  conditional_csp_overrides:
    enabled: false
    when_market_price_below_sma200:
      patch: {}

candidate_ledger:
  enabled: true
  include_rejections: true
  include_skips: false

support:
  primary_method: pivot_cluster_zone
  selection_policy: highest_score

  pivot_cluster:
    enabled: true
    pivot_left_bars: 4
    pivot_right_bars: 4
    lookback_days: 180
    min_touches_required: 2
    preferred_touches: 3
    zone_width_atr_multiple: 0.5
    zone_width_price_pct: 1.0
    reject_if_broken_within_days: 10
    break_requires_close_below_zone: true

  rejection_count:
    enabled: true
    min_rejections_required: 2
    wick_reclaim_required: true

  range_box:
    enabled: true
    lookback_days: 20
    min_box_bars: 10
    use_close_for_floor_ceiling: true
    max_box_height_atr_multiple: 4.0
    require_price_inside_box: true
    reject_if_close_below_floor: true

  moving_average_supports:
    enabled: true
    periods: [50, 200]
    zone_width_atr_multiple: 0.35

  lowest_low_reference:
    enabled: true
    lookbacks: [20, 50, 100]
    allow_20d_low_alone: false

  bollinger_lower_band:
    enabled: true
    bollinger_window_days: 20
    bollinger_stddev: 2

  preconditions:
    enabled: false
    rsi_period: 14
    max_rsi14: 999.0
    max_close_vs_sma50_pct: 999.0
    max_return_10d_pct: 999.0
    max_return_20d_pct: 999.0
    max_bollinger_position: 999.0
    bollinger_position_window_days: 20
    bollinger_position_stddev: 2.0
    require_pullback_from_recent_high: false
    pullback_lookback_days: 10
    min_pullback_from_high_pct: 0.0
    require_recent_bollinger_touch: false
    bollinger_touch_window_days: 20
    bollinger_touch_stddev: 2.0
    bollinger_touch_lookback_days: 10
    bollinger_touch_tolerance_atr_multiple: 0.25
    bollinger_touch_tolerance_pct: 1.0

  scoring:
    mode: legacy
    binary_override_score: 100
    random_seed: 0
    random_score_min: 0
    random_score_max: 100
    min_score_to_trade: 70
    pivot_cluster_weight: 35
    range_floor_weight: 20
    ma_confluence_weight: 15
    rejection_count_weight: 15
    lowest_low_reference_weight: 5
    recency_weight: 10
    penalty_recent_break: -50
    penalty_new_low_within_days: -30
    context_adjustments:
      enabled: false
      rsi_period: 14
      rsi_bonus_max: 60.0
      rsi_bonus: 0.0
      rsi_penalty_min: 70.0
      rsi_penalty: 0.0
      close_vs_sma50_bonus_max_pct: 25.0
      close_vs_sma50_bonus: 0.0
      close_vs_sma50_penalty_min_pct: 30.0
      close_vs_sma50_penalty: 0.0
      return_10d_bonus_max_pct: 8.0
      return_10d_bonus: 0.0
      return_10d_penalty_min_pct: 10.0
      return_10d_penalty: 0.0
      return_20d_bonus_max_pct: 15.0
      return_20d_bonus: 0.0
      return_20d_penalty_min_pct: 20.0
      return_20d_penalty: 0.0
      bollinger_position_window_days: 20
      bollinger_position_stddev: 2.0
      bollinger_position_bonus_max: 0.33
      bollinger_position_bonus: 0.0
      bollinger_position_penalty_min: 0.75
      bollinger_position_penalty: 0.0

csp_selector:
  dte_min: 1
  dte_max: 9
  allowed_strike_offset_count: 1
  require_strike_at_or_below_support_zone_bottom: true
  allow_strike_inside_support_zone_only_in_paper: true
  auto_trade_inside_support_zone: false
  allow_strike_above_support_zone: false
  auto_trade_above_support_zone: false
  allow_one_strike_above_support_only_manual_review: true
  min_strike_distance_atr_multiple: 1.0
  min_strike_distance_pct: 3.0
  delta_policy:
    strong_support:
      min_support_score: 85
      target_delta_min: 0.15
      target_delta_max: 0.30
      auto_trade: true
    normal_support:
      min_support_score: 70
      max_support_score: 84
      target_delta_min: 0.10
      target_delta_max: 0.25
      auto_trade: true
    manual_review:
      target_delta_min: 0.25
      target_delta_max: 0.35
      auto_trade: false
  min_bid: 0.20
  max_spread_pct_of_mid: 0.12
  min_open_interest: 100
  min_weekly_return_on_strike_pct: 0.25

trade_planner:
  default_contract_quantity: 1
  shadow_order:
    broker: alpaca
    type: limit
    time_in_force: day
    position_intent: sell_to_open

backtest_position_sizing:
  mode: fixed
  target_equity_pct: 0.05
  target_dollars: 25000
  min_contracts: 1
  max_contracts: 0

shadow_order_validation:
  max_quote_age_seconds: 30
  max_spread_pct_of_mid: 0.12

cc_selector:
  dte_min: 1
  dte_max: 9
  default_contract_quantity: 1
  min_strike_vs_cost_basis_pct: 0.0
  target_delta_min: 0.10
  target_delta_max: 0.35
  min_bid: 0.10
  max_spread_pct_of_mid: 0.15
  min_open_interest: 50

cc_risk:
  require_earnings_after_expiration: true
  block_unknown_stock_earnings_date: true
  block_ex_dividend_within_contract_window: true
  block_unknown_ex_dividend_date_for_dividend_payers: true

risk:
  max_assignment_cash_pct: 0.80
  min_cash_buffer_pct: 0.15
  max_single_ticker_assignment_pct: 0.15
  max_single_ticker_assignment_dollars: 75000
  no_margin_assignment: true

management:
  csp_hold_to_expiry: true
  cc_hold_to_expiry: true
  csp_exit_model: hold_to_expiration
  cc_exit_model: hold_to_expiration
  profit_take_pct_of_credit: 0.50
  profit_take_price_field: low
  manage_at_dte: 21
  allow_close_near_expiry: true
  close_if_value_remaining_pct_of_credit_below: 10
  no_debit_roll: true
  dca_requires_manual_approval: true
